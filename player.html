<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Video Player</title>
  <link href="https://vjs.zencdn.net/8.9.0/video-js.css" rel="stylesheet" />
  <style>
    /* Video kapsayıcı (16:9 oran için) */
    .video-container {
      position: relative;
      width: 100%;
      max-width: 900px; /* İstersen limit koyabilirsin */
      margin: 0 auto;
      aspect-ratio: 16/9;
    }

    /* Video element */
    .video-container .video-js {
      position: absolute;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    /* Kontroller */
    .vjs-control-bar {
      background-color: #1e1e1e !important;
    }

    .vjs-play-progress,
    .vjs-volume-level,
    .vjs-slider-bar {
      background-color: #ff4500 !important;
    }

    .vjs-slider {
      background-color: #444 !important;
    }

    /* Büyük play butonu */
    .vjs-big-play-button {
      background-color: #ff4500 !important;
      border: none !important;
      border-radius: 50% !important;
      width: 80px;
      height: 80px;
      line-height: 80px;
      font-size: 2em;
    }

    .vjs-big-play-button:hover {
      background-color: #e63e00 !important;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="my-video"
      class="video-js"
      controls
      preload="auto"
      poster=""
      data-setup="{}"
    >
      <source src="123123.mp4" type="video/mp4" />
      <p class="vjs-no-js">
        Tarayıcınız bu videoyu oynatmayı desteklemiyor.
      </p>
    </video>
  </div>

<script src="https://vjs.zencdn.net/8.9.0/video.min.js"></script>
<script>
  // Referrer kontrolü
  if (document.referrer.indexOf("senin-domainin.com") === -1) {
    document.body.innerHTML = "<h2 style='text-align:center; margin-top:50px;'>İzinsiz erişim!</h2>";
  } else {
    // Player sadece izin verilen siteden çağrıldığında çalışır
    var player = videojs('my-video');
    player.ready(function () {
      player.volume(0.8);
    });
  }
</script>

</body>
</html>
